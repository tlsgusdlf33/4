name: price-check

on:
  schedule:
    # 하루 4번 (KST 09:17, 13:17, 17:17, 21:17). 정각은 혼잡해서 지연이 잦아 17분으로.
    - cron: "17 0,4,8,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENST_API_KEY: ${{ secrets.ELEVENST_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python -m pricebot check

      # 알림 중복 방지와 최저가 기록을 위해 상태 파일을 커밋한다 (실패해도 저장).
      - name: Save state
        if: always()
        run: |
          git config user.name "pricebot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/prices.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore(state): price check $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
